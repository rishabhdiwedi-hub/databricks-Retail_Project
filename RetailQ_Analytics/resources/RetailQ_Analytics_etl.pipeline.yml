# The main pipeline for RetailQ_Analytics

resources:
  pipelines:
    RetailQ_Analytics_etl:
      name: RetailQ_Analytics_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/RetailQ_Analytics_etl"

      libraries:
        - glob:
            include: ../src/RetailQ_Analytics_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}

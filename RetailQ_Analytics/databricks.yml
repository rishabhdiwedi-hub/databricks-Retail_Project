# This is a Declarative Automation Bundle definition for RetailQ_Analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: RetailQ_Analytics
  uuid: 1a4e3175-15ce-4a16-b2dd-5fe02873fb2b

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-947e0259-fc91.cloud.databricks.com
    variables:
      catalog: retail_q
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-947e0259-fc91.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rishabh.diwedi.rd@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rishabh.diwedi.rd@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_q
      schema: prod
    permissions:
      - user_name: rishabh.diwedi.rd@gmail.com
        level: CAN_MANAGE
